# Sprint1 bootstrap + bayesian P-success burden (14-day window, 70 steps).
# Two-week lookback at 5 steps/day.
# Identical to sprint1_bootstrap_context_burden except burden uses
# bayesian_p_success mechanism with window_size=70.

initial_state:
  step_bin: inactive
  sleep: good
  day_of_week: weekday
  burden: low

state:
  variables:
    step_bin:
      names: [inactive, moderate, active]
    sleep:
      names: [good, poor]
    day_of_week:
      names: [weekday, weekend]
      advanced:
        type: cyclic
        granularity: daily
        pattern: [weekday, weekday, weekday, weekday, weekday, weekend, weekend]
    burden:
      names: [low, medium, high]
      advanced:
        type: rolling_window_count
        mechanism: bayesian_p_success
        window_size: 70
        conditions:
          - factor: action
            type: in
            values: [movement_suggestion, goal_reminder, journal]
        mapping: {0: low, 1: low, 2: low, 3: low, 4: low, 5: low, 6: low, 7: low, 8: low, 9: low, 10: low, 11: low, 12: low, 13: low, 14: low, 15: low, 16: low, 17: low, 18: low, 19: low, 20: low, 21: low, 22: low, 23: low, 24: low, 25: low, 26: low, 27: low, 28: medium, 29: medium, 30: medium, 31: medium, 32: medium, 33: medium, 34: medium, 35: medium, 36: medium, 37: medium, 38: medium, 39: medium, 40: medium, 41: medium, 42: medium, 43: medium, 44: medium, 45: medium, 46: medium, 47: medium, 48: medium, 49: high, 50: high, 51: high, 52: high, 53: high, 54: high, 55: high, 56: high, 57: high, 58: high, 59: high, 60: high, 61: high, 62: high, 63: high, 64: high, 65: high, 66: high, 67: high, 68: high, 69: high, 70: high}

actions:
  idle: {}
  movement_suggestion: {}
  goal_reminder: {}
  journal: {}

reward:
  constants:
    alpha: 0.9
  variables:
    step_bin_value:
      source: state.step_bin
      mapping: {inactive: 0.0, moderate: 0.5, active: 1.0}
    sleep_value:
      source: state.sleep
      mapping: {good: 1.0, poor: -1.0}
    action_penalty:
      source: action
      mapping: {idle: 0.0, movement_suggestion: 0.05, goal_reminder: 0.05, journal: 0.05}
  formula: "alpha * step_bin_value + (1 - alpha) * sleep_value - action_penalty"

transition_model:
  type: table
  table_dir: ../../../../tables/persona/base_deepseek-v4-flash

episode_days: 90
steps_per_day: 5
seed: 42

agents:
  - type: random

  - type: thompson_sampling
    alpha_prior: 1.0
    beta_prior: 1.0
  - type: thompson_sampling
    contextual: true
    context_features: burden
    alpha_prior: 1.0
    beta_prior: 1.0

  - type: epsilon_greedy
    epsilon: 0.05
  - type: epsilon_greedy
    contextual: true
    context_features: burden
    epsilon: 0.05

  - type: decaying_epsilon_greedy
    epsilon_start: 0.2
    epsilon_min: 0.01
    decay_steps: 200
  - type: decaying_epsilon_greedy
    contextual: true
    context_features: burden
    epsilon_start: 0.2
    epsilon_min: 0.01
    decay_steps: 200

  - type: ucb
    c: 0.5
  - type: ucb
    contextual: true
    context_features: burden
    c: 0.5

  - type: q_learning
    lr: 0.1
    gamma: 0.95
    epsilon: 0.1

  - type: dqn
    lr: 0.01
    gamma: 0.95
    epsilon: 0.2
    batch_size: 8
    buffer_size: 64
    target_update_freq: 10
    grad_clip: 1.0
    hidden_dim: [16, 8]
    state_dim: 32

  - type: reinforce
    lr: 0.01
    gamma: 0.99
    hidden_dim: [16, 8]
    state_dim: 32

  - type: ppo
    lr: 0.01
    gamma: 0.99
    gae_lambda: 0.95
    clip_eps: 0.2
    ppo_epochs: 2
    hidden_dim: [16, 8]
    state_dim: 32

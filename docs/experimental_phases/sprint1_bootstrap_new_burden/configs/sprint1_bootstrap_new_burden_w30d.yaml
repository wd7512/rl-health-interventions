# Sprint1 bootstrap + bayesian P-success burden (30-day window, 150 steps).
# One-month lookback at 5 steps/day.
# Identical to sprint1_bootstrap_context_burden except burden uses
# bayesian_p_success mechanism with window_size=150.

initial_state:
  step_bin: inactive
  sleep: good
  day_of_week: weekday
  burden: low

state:
  variables:
    step_bin:
      names: [inactive, moderate, active]
    sleep:
      names: [good, poor]
    day_of_week:
      names: [weekday, weekend]
      advanced:
        type: cyclic
        granularity: daily
        pattern: [weekday, weekday, weekday, weekday, weekday, weekend, weekend]
    burden:
      names: [low, medium, high]
      advanced:
        type: rolling_window_count
        mechanism: bayesian_p_success
        window_size: 150
        conditions:
          - factor: action
            type: in
            values: [movement_suggestion, goal_reminder, journal]
        mapping: {0: low, 1: low, 2: low, 3: low, 4: low, 5: low, 6: low, 7: low, 8: low, 9: low, 10: low, 11: low, 12: low, 13: low, 14: low, 15: low, 16: low, 17: low, 18: low, 19: low, 20: low, 21: low, 22: low, 23: low, 24: low, 25: low, 26: low, 27: low, 28: low, 29: low, 30: low, 31: low, 32: low, 33: low, 34: low, 35: low, 36: low, 37: low, 38: low, 39: low, 40: low, 41: low, 42: low, 43: low, 44: low, 45: low, 46: low, 47: low, 48: low, 49: low, 50: low, 51: low, 52: low, 53: low, 54: low, 55: low, 56: low, 57: low, 58: medium, 59: medium, 60: medium, 61: medium, 62: medium, 63: medium, 64: medium, 65: medium, 66: medium, 67: medium, 68: medium, 69: medium, 70: medium, 71: medium, 72: medium, 73: medium, 74: medium, 75: medium, 76: medium, 77: medium, 78: medium, 79: medium, 80: medium, 81: medium, 82: medium, 83: medium, 84: medium, 85: medium, 86: medium, 87: medium, 88: medium, 89: medium, 90: medium, 91: medium, 92: medium, 93: medium, 94: medium, 95: medium, 96: medium, 97: medium, 98: medium, 99: medium, 100: medium, 101: medium, 102: medium, 103: high, 104: high, 105: high, 106: high, 107: high, 108: high, 109: high, 110: high, 111: high, 112: high, 113: high, 114: high, 115: high, 116: high, 117: high, 118: high, 119: high, 120: high, 121: high, 122: high, 123: high, 124: high, 125: high, 126: high, 127: high, 128: high, 129: high, 130: high, 131: high, 132: high, 133: high, 134: high, 135: high, 136: high, 137: high, 138: high, 139: high, 140: high, 141: high, 142: high, 143: high, 144: high, 145: high, 146: high, 147: high, 148: high, 149: high, 150: high}

actions:
  idle: {}
  movement_suggestion: {}
  goal_reminder: {}
  journal: {}

reward:
  constants:
    alpha: 0.9
  variables:
    step_bin_value:
      source: state.step_bin
      mapping: {inactive: 0.0, moderate: 0.5, active: 1.0}
    sleep_value:
      source: state.sleep
      mapping: {good: 1.0, poor: -1.0}
    action_penalty:
      source: action
      mapping: {idle: 0.0, movement_suggestion: 0.05, goal_reminder: 0.05, journal: 0.05}
  formula: "alpha * step_bin_value + (1 - alpha) * sleep_value - action_penalty"

transition_model:
  type: table
  table_dir: ../../../../tables/persona/base_deepseek-v4-flash

episode_days: 90
steps_per_day: 5
seed: 42

agents:
  - type: random

  - type: thompson_sampling
    alpha_prior: 1.0
    beta_prior: 1.0
  - type: thompson_sampling
    contextual: true
    context_features: burden
    alpha_prior: 1.0
    beta_prior: 1.0

  - type: epsilon_greedy
    epsilon: 0.05
  - type: epsilon_greedy
    contextual: true
    context_features: burden
    epsilon: 0.05

  - type: decaying_epsilon_greedy
    epsilon_start: 0.2
    epsilon_min: 0.01
    decay_steps: 200
  - type: decaying_epsilon_greedy
    contextual: true
    context_features: burden
    epsilon_start: 0.2
    epsilon_min: 0.01
    decay_steps: 200

  - type: ucb
    c: 0.5
  - type: ucb
    contextual: true
    context_features: burden
    c: 0.5

  - type: q_learning
    lr: 0.1
    gamma: 0.95
    epsilon: 0.1

  - type: dqn
    lr: 0.01
    gamma: 0.95
    epsilon: 0.2
    batch_size: 8
    buffer_size: 64
    target_update_freq: 10
    grad_clip: 1.0
    hidden_dim: [16, 8]
    state_dim: 32

  - type: reinforce
    lr: 0.01
    gamma: 0.99
    hidden_dim: [16, 8]
    state_dim: 32

  - type: ppo
    lr: 0.01
    gamma: 0.99
    gae_lambda: 0.95
    clip_eps: 0.2
    ppo_epochs: 2
    hidden_dim: [16, 8]
    state_dim: 32
